<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexagon Visuals</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #EDEBF3;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding-top: 40px;
    padding-bottom: 40px;
  }

  .frame {
    background: #2E1A3E;
    border-radius: 16px;
    padding: 36px 26px;
    text-align: center;
    color: #EEEDFE;
    width: 340px;
    max-width: 92vw;
    box-sizing: border-box;
  }

  .logo {
    width: 220px;
    max-width: 80%;
    margin: 0 auto 22px;
    display: block;
  }

  .tagline {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #AFA9EC;
    margin: 0 0 22px;
  }

  h1 {
    font-size: 34px;
    font-weight: 500;
    margin: 0 0 4px;
    color: #F5F4FE;
  }

  h1.italic {
    font-style: italic;
    font-family: Georgia, 'Times New Roman', serif;
    color: #EEEDFE;
    margin-bottom: 22px;
  }

  .description {
    font-size: 13px;
    color: #CECBF6;
    line-height: 1.7;
    margin: 0 0 30px;
    padding: 0 6px;
  }

  hr {
    border: none;
    border-top: 0.5px solid #534AB7;
    margin: 0 0 26px;
  }

  .avatar {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: #3C3489;
    margin: 0 auto 12px;
    overflow: hidden;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .owner-label {
    font-size: 12px;
    color: #CECBF6;
    margin: 0 0 28px;
  }

  .cta-line {
    font-size: 13px;
    font-style: italic;
    color: #CECBF6;
    margin: 0 0 14px;
  }

  .cta-button {
    background: #AFA9EC;
    color: #26215C;
    border-radius: 8px;
    padding: 13px;
    font-size: 13px;
    display: block;
    text-align: center;
    text-decoration: none;
    margin-bottom: 22px;
  }

  .social-links {
    font-size: 12px;
    color: #AFA9EC;
  }

  .social-links a {
    text-decoration: underline;
    color: #AFA9EC;
  }

  .sep {
    color: #534AB7;
    margin: 0 8px;
  }
</style>
</head>
<body>

<div class="frame">

  <img src="logo.png" alt="Hexagon Visuals" class="logo">

  <p class="tagline">PHOTOGRAPHY &nbsp;&middot;&nbsp; VIDEOGRAPHY &nbsp;&middot;&nbsp; REELS &nbsp;&middot;&nbsp; CONTENT</p>

  <h1>Hexagon</h1>
  <h1 class="italic">Visuals</h1>

  <p class="description">We create videos that give you something to relive long after the moment, with storytelling at its peak.</p>

  <hr>

  <div class="avatar">
    <img src="founder.jpg" alt="Jonah Precious Chidera">
  </div>
  <p class="owner-label">Founder &mdash; Jonah Precious Chidera</p>

  <p class="cta-line">Have an event or brand shoot coming up?</p>

  <a class="cta-button" href="https://wa.me/2348079680788" target="_blank" rel="noopener">Get in touch</a>

  <p class="social-links">
    <a href="https://www.instagram.com/derah.of.god" target="_blank" rel="noopener">Instagram</a><span class="sep">|</span><a href="https://www.tiktok.com/@hexagon.visuals" target="_blank" rel="noopener">TikTok</a><span class="sep">|</span><a href="mailto:hexagonvisualsproduction@gmail.com">Gmail</a>
  </p>

</div>

</body>
</html>
