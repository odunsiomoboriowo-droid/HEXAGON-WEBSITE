<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hexagon Visuals</title>
<style>
  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    background: #2E1A3E;
    min-height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 48px 24px;
  }

  .frame {
    text-align: center;
    color: #EEEDFE;
    width: 100%;
    max-width: 380px;
  }

  .logo {
    width: 190px;
    max-width: 65%;
    margin: 0 auto 22px;
    display: block;
  }

  .tagline {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1.5px;
    color: #AFA9EC;
    margin: 0 0 20px;
  }

  .tagline .dot {
    font-weight: 900;
    font-size: 15px;
    padding: 0 2px;
  }

  h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 44px;
    font-weight: 500;
    margin: 0;
    line-height: 1.05;
    color: #F5F4FE;
  }

  h1.italic {
    font-style: italic;
    color: #EEEDFE;
  }

  .headline {
    margin: 0 0 22px;
  }

  .description {
    font-size: 15px;
    color: #CECBF6;
    line-height: 1.7;
    margin: 0 0 30px;
    padding: 0 6px;
  }

  hr {
    border: none;
    border-top: 0.5px solid #534AB7;
    margin: 0 0 26px;
  }

  .avatar {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    background: #3C3489;
    margin: 0 auto 16px;
    overflow: hidden;
    border: 6px solid #AFA9EC;
  }

  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .owner-label {
    font-size: 14px;
    color: #CECBF6;
    margin: 0 0 28px;
  }

  .cta-line {
    font-size: 15px;
    font-style: italic;
    color: #CECBF6;
    margin: 0 0 14px;
  }

  .cta-button {
    background: #AFA9EC;
    color: #26215C;
    border-radius: 8px;
    padding: 15px;
    font-size: 15px;
    font-weight: 600;
    display: block;
    text-align: center;
    text-decoration: none;
    margin-bottom: 22px;
  }

  .social-links {
    font-size: 14px;
    color: #AFA9EC;
  }

  .social-links a {
    text-decoration: underline;
    color: #AFA9EC;
    font-weight: 600;
  }

  .sep {
    color: #AFA9EC;
    font-weight: 900;
    margin: 0 8px;
  }
</style>
</head>
<body>

<div class="frame">

  <img src="logo.png" alt="Hexagon Visuals" class="logo">

  <p class="tagline">PHOTOGRAPHY <span class="dot">&middot;</span> VIDEOGRAPHY <span class="dot">&middot;</span> REELS <span class="dot">&middot;</span> CONTENT</p>

  <div class="headline">
    <h1>Hexagon</h1>
    <h1 class="italic">Visuals</h1>
  </div>

  <p class="description">We create videos that give you something to relive long after the moment, with storytelling at its peak.</p>

  <hr>

  <div class="avatar">
    <img src="founder.jpg" alt="Jonah Precious Chidera">
  </div>
  <p class="owner-label">Founder &mdash; Jonah Precious Chidera</p>

  <p class="cta-line">Have an event or brand shoot coming up?</p>

  <a class="cta-button" href="https://wa.me/2348079680788" target="_blank" rel="noopener">Get in touch</a>

  <p class="social-links">
    <a href="https://www.instagram.com/derah.of.god" target="_blank" rel="noopener">Instagram</a><span class="sep">|</span><a href="https://www.tiktok.com/@hexagon.visuals" target="_blank" rel="noopener">TikTok</a><span class="sep">|</span><a href="mailto:hexagonvisualsproduction@gmail.com">Gmail</a>
  </p>

</div>

</body>
</html>
